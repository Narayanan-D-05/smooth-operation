modules:
  jira:issuePanel:
    - key: paddock-shield-panel
      resource: main
      render: native
      title: 🏁 Paddock Shield - Race Control
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  rovo:agent:
    - key: race-engineer-agent
      name: Race Engineer
      description: AI co-pilot for F1-speed incident response. Ask about IP leaks, telemetry breaches, and security incidents.
      prompt: src/raceEngineerPrompt.md
      function: race-engineer-handler
      conversationStarters:
        - "Show me all IP leak incidents this week"
        - "Who accessed the Front Wing CAD file?"
        - "What's our current pit stop time (MTTR)?"
        - "Generate a race classification for incident PDKS-42"
      actions:
        - key: get-incident-telemetry
        - key: analyze-ip-leak
        - key: check-access-logs
  action:
    - key: get-incident-telemetry
      name: Get Incident Telemetry
      description: Retrieves detailed telemetry data (access logs, timeline, anomalies) for a specific security incident
      function: get-telemetry-action
    - key: analyze-ip-leak
      name: Analyze IP Leak
      description: Analyzes potential IP leaks to determine severity, scope, and recommended containment actions
      function: analyze-leak-action
    - key: check-access-logs
      name: Check Access Logs
      description: Searches access logs for specific users, files, or time ranges to identify unauthorized activity
      function: check-logs-action
  function:
    - key: resolver
      handler: index.handler
    - key: create-incident-tasks
      handler: taskOrchestration.createIncidentTasks
    - key: deploy-pit-crew
      handler: agents.executeResponse
    - key: detect-anomalies
      handler: agents.detectAnomalies
    - key: race-engineer-handler
      handler: rovoHandlers.raceEngineerHandler
    - key: get-telemetry-action
      handler: rovoHandlers.getIncidentTelemetry
    - key: analyze-leak-action
      handler: rovoHandlers.analyzeIpLeak
    - key: check-logs-action
      handler: rovoHandlers.checkAccessLogs
    - key: incident-trigger
      handler: triggers.onIncidentCreated
  trigger:
    - key: incident-created-trigger
      function: incident-trigger
      events:
        - avi:jira:created:issue
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 512
    architecture: arm64
  id: ari:cloud:ecosystem::app/7c11e1e1-f31c-4809-88b9-99279bff2490
